[project]
name = "echolocate"
version = "0.1.0"
description = "Self-hosted GEO/AIO monitor: send buyer prompts into ChatGPT, Gemini, Claude, Perplexity and Google AI every day and listen for your brand bouncing back."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "anthropic>=0.60",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "mcp>=1.2",
]

[project.scripts]
echolocate = "echolocate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/echolocate"]
